# Example config for claude-usage.
#
# Copy to ~/.config/claude-usage/config.toml and edit. Every key below is
# optional: a missing file, a missing key, or a file that fails to parse
# falls back to the default shown here, and the daemon still starts.
#
# All values below are the built-in defaults unless noted otherwise.

# How often to poll the quota endpoint and re-check the active session, in
# seconds. Values below 10 are floored to 10 to avoid a request flood.
poll_seconds = 60

[bar]
# Template for the text drawn on the panel next to the icon (exported as the
# XAyatanaLabel; plain StatusNotifierItem hosts that don't read that
# property won't show it). An unknown placeholder, e.g. a typo, is left
# literal in the output instead of vanishing, so mistakes are visible.
#
# Placeholders:
#   {auto}            "12% · 35%" (5-hour · weekly), or just "35%" when there
#                     is no 5-hour window: none running, or a plan without
#                     that limit
#   {session}         5-hour window usage, whole percent; "—" when there is
#                     no 5-hour window
#   {weekly}          7-day window usage, whole percent
#   {session_reset}   time until the 5-hour window clears (e.g. "2h10m")
#   {weekly_reset}    time until the 7-day window clears
#   {reset}           WHICHEVER OF THE TWO IS NEARER — not the weekly one.
#                     The 5-hour window is nearer almost always, so a
#                     template pairing "{weekly}%" with "reset {reset}" will
#                     read as a claim about the weekly window while showing
#                     the session one. Use {weekly_reset} when you mean the
#                     weekly window. Both windows' reset times are also in
#                     the menu, so any of these can be checked.
#   {cost}            session cost estimate, or "—" if a model in the
#                     session has no known price
#   {tokens}          the active session's OUTPUT tokens (the menu shows
#                     input, output and cache separately)
#   {project}, {model}, {tokens}, {cost}   from the active session; all
#                     render "—" while no session is running (no assistant
#                     turn in the last 30 minutes), the normal idle state
#
# A literal "{" that does not open a placeholder is kept as text.
#
# Three states replace the template entirely, and rules are not applied:
# "⚠ reautenticar" (token rejected), "⚠ sem credencial" (no credentials
# file) and "⚠ sem dados" (no reading yet). A reading that could not be
# refreshed keeps the template and gets its age appended, e.g. "35% · 3m".
format = "{auto}"

# Optional rules that override the format and/or color when a metric crosses
# a value. Rules are checked top to bottom; the first match wins. `metric`
# is one of "session", "weekly", "cost". `above` is inclusive (above = 90
# matches at exactly 90). A "session" rule never matches while there is no
# 5-hour window. `color` is a "#rrggbb" hex string.
#
# `effect = "pulse"` here WORKS, two ways: it sets the StatusNotifierItem
# status to NeedsAttention for as long as the rule stays matched (whether a
# host renders that any differently is up to the host), and the moment the
# level is actually crossed — not every cycle it stays crossed — the icon
# also plays a short, fixed, 2-second frame-by-frame pulse of its own
# drawing. There is no duration key here to tune that: rules have no
# `duration` field, unlike [reset] below, which is a different key with its
# own configurable length.
#
# [[bar.rules]]
# metric = "weekly"
# above = 90
# color = "#e5a50a"
# effect = "pulse"
#
# [[bar.rules]]
# metric = "weekly"
# above = 95
# format = "⚠ {weekly}% · reset {weekly_reset}"
# color = "#e01b24"

[threshold]
# Percentages, per metric (session and weekly independently), that trigger a
# desktop notification when crossed upward.
levels = [75, 90, 95]
# A crossed level stays "armed" (won't refire) until the metric drops this
# many points below it, so a value oscillating right at a level doesn't spam
# notifications.
hysteresis = 2.0
# Whether crossing a level in `levels` fires a desktop notification. This
# works.
notify = true

[reset]
# Whether a window rolling over (session or weekly resetting to 0) fires a
# desktop notification. This works.
notify = true

# `effect` and `duration` here are a DIFFERENT pair of keys from
# [bar].rules[].effect above (which has no duration of its own). These two
# WORK: on a window reset, `effect = "pulse"` plays a frame-by-frame pulse
# of the icon for `duration` seconds. Anything other than "pulse" for
# `effect`, or `duration = 0`, means no animation at all — silence, not a
# one-frame flicker. `duration` is capped at 30 seconds regardless of what
# is written here, so a very large value cannot leave the icon animating
# indefinitely.
#
# The animation runs by borrowing from the sleep between polls, not by
# adding a separate timer, so a long `duration` against a short
# `poll_seconds` measurably slows down polling: at the 10-second floor with
# `duration` at its 30-second cap, the next poll lands ~30 seconds after the
# last one, three times the configured interval, not a rounding error.
# Lower `duration` if a short `poll_seconds` matters more than a long pulse.
effect = "pulse"
duration = 2
