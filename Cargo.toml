[package]
name = "claude-usage"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lightweight GNOME tray indicator for Claude Code quota usage"

[dependencies]
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
notify = "6"
toml = "0.8"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
