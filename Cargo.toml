[package]
name = "claude-usage"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lightweight GNOME tray indicator for Claude Code quota usage"

[dependencies]
ksni = "0.2"
# Not used directly; forces ksni's transitive dbus/libdbus-sys to build the
# vendored C library instead of requiring pkg-config + libdbus-1-dev on the
# host. Do not remove without checking `cargo tree -f "{p} {f}" -i libdbus-sys`.
dbus = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
notify = "6"
toml = "0.8"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }

[build-dependencies]
# Same vendored trick, needed here too: ksni's build-dependency (dbus-codegen)
# pulls in dbus/libdbus-sys on the host feature graph independently of the
# normal-dependency graph above.
dbus = { version = "0.9", features = ["vendored"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
