[package]
name = "claude-usage"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lightweight GNOME tray indicator for Claude Code quota usage"

[dependencies]
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
toml = "0.8"
time = { version = "0.3", features = ["parsing"] }
zbus = { version = "5", default-features = false, features = ["blocking-api"] }

[dev-dependencies]
# `datetime!` is used by unit tests only. Kept out of [dependencies] so the
# macro crate is not pulled into a release build.
time = { version = "0.3", features = ["macros"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Local fork of ksni 0.3.6 (vendored verbatim from crates.io), patched to expose
# the Ayatana label extension. Search for "LOCAL PATCH" in vendor/ksni/src.
[patch.crates-io]
ksni = { path = "vendor/ksni" }
